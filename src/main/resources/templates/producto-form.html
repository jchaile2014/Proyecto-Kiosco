<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina(${titulo}, ~{::main}, 'productos')}">
<body>
<main>
    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="page-pretitle">Productos</div>
            <h2 class="page-title" th:text="${titulo}">Nuevo producto</h2>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="row g-3">
                <div class="col-lg-8">
                    <form class="card" method="post" th:object="${productoForm}"
                          th:action="${productoId == null} ? @{/productos} : @{/productos/{id}(id=${productoId})}">
                        <div class="card-body">
                            <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}"></div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label required" for="codigo">Código</label>
                                    <input id="codigo" type="text" class="form-control" maxlength="40" autocomplete="off"
                                           placeholder="7790895000997" th:field="*{codigo}" autofocus>
                                    <small class="form-hint">El del código de barras, o uno corto que te acuerdes (por ejemplo "coca").</small>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label required" for="nombre">Nombre</label>
                                    <input id="nombre" type="text" class="form-control" maxlength="100" autocomplete="off"
                                           placeholder="Coca-Cola 2,25 L" th:field="*{nombre}">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" for="precio">Precio</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input id="precio" type="text" inputmode="decimal" class="form-control monto" autocomplete="off"
                                               placeholder="3.200" th:field="*{precio}">
                                    </div>
                                </div>
                            </div>

                            <label class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{controlaStock}" data-muestra="campos-stock">
                                <span class="form-check-label">Llevar la cuenta del stock</span>
                                <span class="form-check-description">
                                    Cada venta con este código descuenta unidades, y te avisa cuando queda poco.
                                </span>
                            </label>

                            <div id="campos-stock" class="row g-3 mt-1" th:hidden="${!productoForm.controlaStock}">
                                <div class="col-md-4">
                                    <label class="form-label" for="stock">Unidades que hay ahora</label>
                                    <input id="stock" type="text" inputmode="numeric" class="form-control monto" autocomplete="off"
                                           placeholder="0" th:field="*{stock}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="stockMinimo">
                                        Avisar cuando queden <span class="form-label-description">opcional</span>
                                    </label>
                                    <input id="stockMinimo" type="text" inputmode="numeric" class="form-control monto" autocomplete="off"
                                           placeholder="5" th:field="*{stockMinimo}">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex gap-2">
                            <a class="btn" th:href="@{/productos}">Volver</a>
                            <button class="btn btn-primary ms-auto" type="submit">
                                <i class="ti ti-check me-1" aria-hidden="true"></i>Guardar
                            </button>
                        </div>
                    </form>

                    <form class="mt-3 text-end" method="post" th:if="${productoId != null}"
                          th:action="@{/productos/{id}/baja(id=${productoId})}"
                          onsubmit="return confirm('¿Sacar este producto de la lista? Las ventas anteriores no cambian.')">
                        <button class="btn btn-ghost-danger" type="submit">
                            <i class="ti ti-trash me-1" aria-hidden="true"></i>Sacar de la lista de productos
                        </button>
                    </form>
                </div>

                <div class="col-lg-4" th:unless="${historial.isEmpty()}">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Últimos movimientos de stock</h3>
                        </div>
                        <table class="table table-sm card-table">
                            <tbody>
                            <tr th:each="m : ${historial}">
                                <td class="text-secondary monto text-nowrap"
                                    th:text="|${@fmt.fechaCorta(m.registradoEn.toLocalDate())} ${@fmt.hora(m.registradoEn)}|">26/09 10:42</td>
                                <td th:text="${m.motivo.etiqueta}">Venta</td>
                                <td class="text-end monto" th:classappend="${m.cantidad < 0} ? 'text-red' : 'text-green'"
                                    th:text="${m.cantidad > 0} ? |+${m.cantidad}| : ${m.cantidad}">−1</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
