<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Editar cliente', ~{::main}, 'fiados')}">
<body>
<main>
    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="page-pretitle">Fiados</div>
            <h2 class="page-title">Editar cliente</h2>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="row">
                <div class="col-lg-8">
                    <form class="card" method="post" th:action="@{/fiados/{id}/editar(id=${cliente.id})}">
                        <div class="card-body">
                            <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}"></div>
                            <div class="row g-3">
                                <div class="col-md-7">
                                    <label class="form-label required" for="nombre">Nombre</label>
                                    <input id="nombre" name="nombre" type="text" class="form-control" maxlength="80"
                                           autocomplete="off" th:value="${nombre}" autofocus>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label" for="telefono">
                                        Teléfono <span class="form-label-description">opcional</span>
                                    </label>
                                    <input id="telefono" name="telefono" type="tel" class="form-control" maxlength="40"
                                           autocomplete="off" placeholder="11 5555-1234" th:value="${telefono}">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex gap-2">
                            <a class="btn" th:href="@{/fiados/{id}(id=${cliente.id})}">Volver</a>
                            <button class="btn btn-primary ms-auto" type="submit">
                                <i class="ti ti-check me-1" aria-hidden="true"></i>Guardar
                            </button>
                        </div>
                    </form>

                    <form class="mt-3 text-end" method="post" th:action="@{/fiados/{id}/baja(id=${cliente.id})}"
                          onsubmit="return confirm('¿Sacar este cliente de la lista? Solo se puede si no debe nada.')">
                        <button class="btn btn-ghost-danger" type="submit">
                            <i class="ti ti-trash me-1" aria-hidden="true"></i>Sacar de la lista de clientes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
