spring.application.name=kiosco

# Solo se puede abrir desde esta PC
server.address=127.0.0.1
server.port=8080

# Conexión a MySQL. El usuario y la contraseña van en ~/.kiosco/kiosco.properties
# (fuera del repo) o en las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.config.import=optional:file:${user.home}/.kiosco/kiosco.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kiosco}
spring.datasource.username=${DB_USER:kiosco}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas las crea y actualiza Flyway (src/main/resources/db/migration);
# Hibernate solo verifica que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.format.date=iso
